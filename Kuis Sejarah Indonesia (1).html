<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis Sejarah Indonesia</title>
<style>
:root{--bg:#1b1026;--card:#2b1745;--card2:#4a1f3d;--tx:#fbf3ea;--mut:#a99bc0;--line:#4a3566;--acc:#ffc531;--red:#ef4444;--ok:#34d399;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f0fa;--card:#fff;--card2:#fff3d6;--tx:#24123a;--mut:#6b5a85;--line:#d9cce8;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:920px;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.top b{font-size:18px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip{border-color:var(--red);font-weight:700;cursor:default}
.nums{display:flex;gap:6px;flex-wrap:wrap}
.nums button{width:34px;height:34px;padding:0;border-radius:8px;font-weight:700;font-size:13px}
.nums .on{background:var(--red);border-color:var(--red);color:#fff}
.nums .done{border-color:var(--ok)}
.bar{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.clock{flex:1;text-align:center;font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.clock.low{color:var(--red)}
.track{height:6px;background:var(--line);border-radius:6px;margin-bottom:18px;overflow:hidden}
.fill{height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--acc));transition:width 1s linear}
.stage{perspective:1400px;height:min(52vh,420px);min-height:280px}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.flip.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;border:1px solid var(--line);background:var(--card);padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.back{transform:rotateY(180deg);background:var(--card2);border-color:var(--acc)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;font-weight:700}
.meta i{color:var(--red);font-style:normal}
.back .meta i{color:var(--ok)}
.q{font-size:clamp(22px,4.4vw,36px);font-weight:800;line-height:1.25;margin:0}
.a{font-size:clamp(28px,6vw,52px);font-weight:800;color:var(--acc);margin:0}
.note{color:var(--mut);font-size:16px;margin:8px 0 0}
.ctl{display:flex;justify-content:center;gap:10px;margin:22px 0;flex-wrap:wrap}
.main{background:var(--acc);color:#2a1a00;border-color:var(--acc);font-weight:800;padding:13px 26px;box-shadow:0 8px 24px rgba(255,197,49,.25)}
.main:hover{border-color:#fff}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.team{display:flex;align-items:center;gap:8px;margin:10px 0}
.team input{flex:1;min-width:0;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px}
.team output{min-width:44px;text-align:center;font-size:22px;font-weight:800;color:var(--acc)}
@media (prefers-reduced-motion:reduce){.flip{transition:none}.fill{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <b>Kuis Sejarah</b>
    <div class="row">
      <span id="prog" style="color:var(--mut);font-size:13px"></span>
      <button id="sb">🏆 Papan skor</button>
      <button id="fs" aria-label="Layar penuh">⛶</button>
    </div>
  </div>
  <div class="top" style="margin-top:16px">
    <span class="chip" style="padding:9px 14px;border:1px solid var(--red);border-radius:12px">Sejarah Indonesia</span>
    <div class="nums" id="nums"></div>
  </div>
  <div class="bar">
    <button id="pause" aria-label="Jeda">⏸</button>
    <div class="clock" id="clock">01:00</div>
    <button id="reset" aria-label="Ulang timer">↻</button>
    <button id="snd" aria-label="Suara">🔊</button>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="stage">
    <div class="flip" id="flip">
      <div class="face front">
        <div class="meta"><span>Pertanyaan</span><i id="qn"></i></div>
        <p class="q" id="q"></p>
        <span></span>
      </div>
      <div class="face back">
        <div class="meta"><span>Jawaban</span><i id="an"></i></div>
        <div><p class="a" id="a"></p><p class="note" id="n"></p></div>
        <span></span>
      </div>
    </div>
  </div>
  <div class="ctl">
    <button id="prev">← Sebelumnya</button>
    <button class="main" id="reveal">Buka jawaban</button>
    <button id="next">Berikutnya →</button>
  </div>
</div>
<dialog id="dlg">
  <h3 style="margin:0 0 8px">Papan skor</h3>
  <div id="teams"></div>
  <div class="ctl" style="margin:14px 0 0"><button id="close">Tutup</button></div>
</dialog>
<script>
const Q=[
["Kerajaan Hindu tertua di Indonesia yang berada di Kalimantan Timur adalah?","Kutai","Berdiri sekitar abad ke-4 Masehi."],
["Raja terbesar Kerajaan Kutai yang namanya banyak disebut dalam prasasti Yupa adalah?","Mulawarman","Putra Aswawarman, cucu Kudungga."],
["Raja Majapahit yang membawa kerajaan ke puncak kejayaan bersama Mahapatih Gajah Mada adalah?","Hayam Wuruk","Memerintah sekitar 1350–1389."],
["Sumpah Gajah Mada untuk menyatukan Nusantara disebut?","Sumpah Palapa","Diucapkan saat diangkat menjadi Mahapatih."],
["Candi Buddha terbesar di dunia di Magelang, dibangun pada masa Dinasti Syailendra, adalah?","Candi Borobudur","Dibangun sekitar abad ke-8 sampai ke-9."],
["Kapan Proklamasi Kemerdekaan Indonesia dibacakan?","17 Agustus 1945","Dibacakan Soekarno–Hatta di Jl. Pegangsaan Timur 56, Jakarta."],
["Sumpah Pemuda diikrarkan pada tanggal?","28 Oktober 1928","Hasil Kongres Pemuda II."],
["Pertempuran besar yang diperingati sebagai Hari Pahlawan terjadi di kota?","Surabaya","Terjadi pada 10 November 1945."],
["Konferensi Asia-Afrika 1955 diselenggarakan di kota?","Bandung","Digelar di Gedung Merdeka."],
["Sultan Mataram yang menyerang VOC di Batavia pada 1628 dan 1629 adalah?","Sultan Agung","Serangan itu gagal karena kehabisan logistik."]
];
const T=60;let i=0,left=T,run=true,mute=false,seen=new Set(),tm;
const $=id=>document.getElementById(id);
function beep(f,d){if(mute)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function draw(){
  $('qn').textContent=$('an').textContent='Soal '+(i+1);
  $('q').textContent=Q[i][0];$('a').textContent=Q[i][1];$('n').textContent=Q[i][2];
  $('prog').textContent=seen.size+'/'+Q.length+' soal';
  $('nums').innerHTML=Q.map((_,k)=>'<button data-k="'+k+'" class="'+(k==i?'on':seen.has(k)?'done':'')+'">'+(k+1)+'</button>').join('');
  $('prev').disabled=i==0;$('next').disabled=i==Q.length-1;
}
function tick(){
  const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');
  $('clock').textContent=m+':'+s;$('clock').classList.toggle('low',left<=10);
  $('fill').style.width=(left/T*100)+'%';
}
function go(k){i=k;$('flip').classList.remove('open');$('reveal').textContent='Buka jawaban';left=T;run=true;$('pause').textContent='⏸';tick();draw()}
function flip(){
  const o=$('flip').classList.toggle('open');
  $('reveal').textContent=o?'Tutup jawaban':'Buka jawaban';
  if(o){seen.add(i);run=false;$('pause').textContent='▶';draw()}
}
tm=setInterval(()=>{if(!run)return;if(left>0){left--;tick();if(left<=5&&left>0)beep(660,.08);if(left==0){beep(220,.5);run=false}}},1000);
$('nums').onclick=e=>{const k=e.target.dataset.k;if(k!==undefined)go(+k)};
$('prev').onclick=()=>i>0&&go(i-1);
$('next').onclick=()=>i<Q.length-1&&go(i+1);
$('reveal').onclick=flip;
$('pause').onclick=()=>{run=!run;$('pause').textContent=run?'⏸':'▶'};
$('reset').onclick=()=>{left=T;run=true;$('pause').textContent='⏸';tick()};
$('snd').onclick=()=>{mute=!mute;$('snd').textContent=mute?'🔇':'🔊'};
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
const sc=[0,0,0,0];
function teams(){$('teams').innerHTML=sc.map((v,k)=>'<div class="team"><input value="Tim '+(k+1)+'" aria-label="Nama tim"><button data-t="'+k+'" data-d="-1">−</button><output>'+v+'</output><button data-t="'+k+'" data-d="1">+</button></div>').join('')}
$('sb').onclick=()=>{teams();$('dlg').showModal()};
$('close').onclick=()=>$('dlg').close();
$('teams').onclick=e=>{const b=e.target.closest('button');if(!b)return;sc[b.dataset.t]+=+b.dataset.d*10;b.parentNode.querySelector('output').textContent=sc[b.dataset.t]};
document.addEventListener('keydown',e=>{if($('dlg').open)return;if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('prev').click();else if(e.key===' '||e.key==='Enter'){if(document.activeElement.tagName!=='BUTTON'){e.preventDefault();flip()}}});
go(0);
</script>
</body>
</html>
